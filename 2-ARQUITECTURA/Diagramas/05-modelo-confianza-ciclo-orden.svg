<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Quién controla qué y ciclo de vida de una orden: comprador, asistente, TilcAI, negocio y rieles de pago; siete estados desde la solicitud hasta el cumplimiento, con el pago separado de la entrega.">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1e1e1e"/></marker></defs>
<text x="40" y="50" font-size="26" font-weight="700" text-anchor="start" fill="#1e1e1e">Modelo de confianza y ciclo de vida de una orden</text>
<text x="40" y="76" font-size="14" text-anchor="start" fill="#495057">Quién decide qué, y por qué estados pasa una compra. Pagar no es entregar; un timeout no es permiso para repetir el cobro.</text>
<rect x="40" y="100" width="1420" height="220" rx="16" fill="#dbe4ff" fill-opacity=".35" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#3b5bdb">1 · Quién controla qué (la IA propone; nunca mueve fondos ni inventa precios)</text>
<rect x="60" y="140" width="250" height="150" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="185.0" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Comprador</text>
<text x="185.0" y="186.0" font-size="12.5" text-anchor="middle" fill="#495057">Aprueba importe y destinatario</text>
<text x="185.0" y="202.5" font-size="12.5" text-anchor="middle" fill="#495057">exactos, en una superficie web</text>
<text x="185.0" y="219.0" font-size="12.5" text-anchor="middle" fill="#495057">segura.</text>
<text x="185.0" y="235.5" font-size="12.5" text-anchor="middle" fill="#495057">Custodia su propia credencial:</text>
<text x="185.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#495057">nunca se pide por chat.</text>
<rect x="330" y="140" width="250" height="150" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="455.0" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Canal / asistente de IA</text>
<text x="455.0" y="186.0" font-size="12.5" text-anchor="middle" fill="#495057">WhatsApp, asistente MCP o app</text>
<text x="455.0" y="202.5" font-size="12.5" text-anchor="middle" fill="#495057">con API. Estructura la intención.</text>
<text x="455.0" y="219.0" font-size="12.5" text-anchor="middle" fill="#495057">Propone y consulta.</text>
<text x="455.0" y="235.5" font-size="12.5" text-anchor="middle" fill="#495057">No firma, no cobra, no fija</text>
<text x="455.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#495057">precios: sin autoridad propia.</text>
<rect x="600" y="140" width="250" height="150" rx="10" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2"/>
<text x="725.0" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcAI (infraestructura)</text>
<text x="725.0" y="186.0" font-size="12.5" text-anchor="middle" fill="#495057">Identidad y tenant · política</text>
<text x="725.0" y="202.5" font-size="12.5" text-anchor="middle" fill="#495057">y límites · orden idempotente</text>
<text x="725.0" y="219.0" font-size="12.5" text-anchor="middle" fill="#495057">· router de pago · conciliación</text>
<text x="725.0" y="235.5" font-size="12.5" text-anchor="middle" fill="#495057">· recibos y auditoría.</text>
<text x="725.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#495057">ALLOW = elegible, no pago.</text>
<rect x="870" y="140" width="250" height="150" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="995.0" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Negocio (fuente de verdad)</text>
<text x="995.0" y="186.0" font-size="12.5" text-anchor="middle" fill="#495057">Agente propio, POS/agenda u</text>
<text x="995.0" y="202.5" font-size="12.5" text-anchor="middle" fill="#495057">operador humano. Fija precio,</text>
<text x="995.0" y="219.0" font-size="12.5" text-anchor="middle" fill="#495057">stock, vigencia y payTo.</text>
<text x="995.0" y="235.5" font-size="12.5" text-anchor="middle" fill="#495057">Confirma el cumplimiento</text>
<text x="995.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#495057">por separado.</text>
<rect x="1140" y="140" width="260" height="150" rx="10" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
<text x="1270.0" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Rieles de pago (externos)</text>
<text x="1270.0" y="186.0" font-size="12.5" text-anchor="middle" fill="#495057">x402 vía OpenZeppelin Relayer;</text>
<text x="1270.0" y="202.5" font-size="12.5" text-anchor="middle" fill="#495057">o CCTP: burn en Fuji, atestación</text>
<text x="1270.0" y="219.0" font-size="12.5" text-anchor="middle" fill="#495057">Circle y mint de USDC en Stellar.</text>
<text x="1270.0" y="235.5" font-size="12.5" text-anchor="middle" fill="#495057">Un intento = un riel. Son</text>
<text x="1270.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#495057">alternativas, no dos cobros.</text>
<polyline points="310,215 330,215" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="580,215 600,215" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="850,215 870,215" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="1120,215 1140,215" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="60" y="345" font-size="13" font-weight="700" text-anchor="start" fill="#1e1e1e">Frontera clave: la aprobación compromete importe, activo, red, destinatario, quoteId, vencimiento y orderId.</text>
<rect x="40" y="370" width="1420" height="300" rx="16" fill="#ffe8cc" fill-opacity=".35" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="396" font-size="15" font-weight="700" text-anchor="start" fill="#e8590c">2 · Ciclo de vida de una orden (estados de comercio y de pago ligados por orderId)</text>
<rect x="60" y="410" width="170" height="50" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="145.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Solicitada</text>
<text x="145.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">Comprador</text>
<text x="145.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">mensaje + principal</text>
<text x="145.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">autenticado</text>
<polyline points="230,435 256,435" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="256" y="410" width="170" height="50" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="341.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Consultada</text>
<text x="341.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcAI</text>
<text x="341.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">busca negocios con</text>
<text x="341.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">capacidades publicadas</text>
<polyline points="426,435 452,435" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="452" y="410" width="170" height="50" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="537.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Cotizada</text>
<text x="537.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">Negocio</text>
<text x="537.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">quoteId, total, vigencia,</text>
<text x="537.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">payTo versionado</text>
<polyline points="622,435 648,435" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="648" y="410" width="170" height="50" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="733.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Aprobada</text>
<text x="733.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">Comprador</text>
<text x="733.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">política OK + aprobación</text>
<text x="733.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">exacta; presupuesto retenido</text>
<polyline points="818,435 844,435" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="844" y="410" width="170" height="50" rx="10" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
<text x="929.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Pago en curso</text>
<text x="929.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcAI + riel</text>
<text x="929.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">paymentAttemptId con</text>
<text x="929.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">Idempotency-Key</text>
<polyline points="1014,435 1040,435" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1040" y="410" width="170" height="50" rx="10" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2"/>
<text x="1125.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Pagada</text>
<text x="1125.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">Conciliador</text>
<text x="1125.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">hash origen, atestación,</text>
<text x="1125.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">hash destino ligados</text>
<polyline points="1210,435 1236,435" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1236" y="410" width="170" height="50" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="1321.0" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Cumplida</text>
<text x="1321.0" y="485" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e1e1e">Negocio</text>
<text x="1321.0" y="502" font-size="11.5" text-anchor="middle" fill="#495057">reserva/retiro/entrega con</text>
<text x="1321.0" y="517" font-size="11.5" text-anchor="middle" fill="#495057">su propia evidencia</text>
<rect x="844" y="565" width="230" height="70" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2" stroke-dasharray="6 4"/>
<text x="959.0" y="589" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">UNCERTAIN</text>
<text x="959.0" y="611.0" font-size="12.5" text-anchor="middle" fill="#495057">timeout o fallo parcial: se concilia</text>
<text x="959.0" y="627.5" font-size="12.5" text-anchor="middle" fill="#495057">antes de reintentar. Nunca 2.º burn.</text>
<polyline points="1044,460 1044,565" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<rect x="432" y="565" width="210" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2" stroke-dasharray="6 4"/>
<text x="537.0" y="589" font-size="15" font-weight="700" text-anchor="middle" fill="#1e1e1e">Rechazada / expirada</text>
<text x="537.0" y="611.0" font-size="12.5" text-anchor="middle" fill="#495057">sin aprobación o fuera de</text>
<text x="537.0" y="627.5" font-size="12.5" text-anchor="middle" fill="#495057">vigencia: el pago nunca inicia.</text>
<polyline points="632,460 632,565" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="60" y="655" font-size="12.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Pagada ≠ entregada: el recibo financiero y la confirmación comercial son evidencias distintas; «entregado» no aparece solo al pagar.</text>
<rect x="40" y="700" width="1420" height="150" rx="16" fill="#f1f3f5" fill-opacity=".35" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="726" font-size="15" font-weight="700" text-anchor="start" fill="#495057">3 · Reglas que el diseño impone</text>
<rect x="60" y="740" width="330" height="90" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
<text x="72" y="761" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Sin autoridad por modelo</text>
<text x="72" y="780.0" font-size="12" text-anchor="start" fill="#495057">Ningún LLM obtiene por sí</text>
<text x="72" y="795.5" font-size="12" text-anchor="start" fill="#495057">mismo permiso de mover fondos.</text>
<text x="72" y="811.0" font-size="12" text-anchor="start" fill="#495057">Todo pasa por política + aprobación.</text>
<rect x="410" y="740" width="330" height="90" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="422" y="761" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Idempotencia y conciliación</text>
<text x="422" y="780.0" font-size="12" text-anchor="start" fill="#495057">Cada escritura lleva Idempotency-Key.</text>
<text x="422" y="795.5" font-size="12" text-anchor="start" fill="#495057">Ante incertidumbre: conciliar</text>
<text x="422" y="811.0" font-size="12" text-anchor="start" fill="#495057">y solo entonces decidir.</text>
<rect x="760" y="740" width="330" height="90" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/>
<text x="772" y="761" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Claves fuera del chat</text>
<text x="772" y="780.0" font-size="12" text-anchor="start" fill="#495057">Crear/conectar cuenta, fondearla</text>
<text x="772" y="795.5" font-size="12" text-anchor="start" fill="#495057">y aprobar son actos distintos.</text>
<text x="772" y="811.0" font-size="12" text-anchor="start" fill="#495057">Semillas y firmas: nunca por chat.</text>
<rect x="1110" y="740" width="330" height="90" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
<text x="1122" y="761" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Honestidad de estado</text>
<text x="1122" y="780.0" font-size="12" text-anchor="start" fill="#495057">Una simulación web no es una</text>
<text x="1122" y="795.5" font-size="12" text-anchor="start" fill="#495057">compra operativa. Fuji → Stellar es</text>
<text x="1122" y="811.0" font-size="12" text-anchor="start" fill="#495057">el corredor verificado; el resto, lab.</text>
<text x="40" y="880" font-size="11.5" text-anchor="start" fill="#495057">Fuentes: 0-OFICIAL/CONTEXTO_OFICIAL_TILCAI.md y 2-ARQUITECTURA/TILCAI_FLUJO_INTEGRADO_Y_DEMO_2026-10-08.md. Nombres de estados orientativos: los tipos exactos viven en @tilcai/core.</text>
</svg>
