<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 830" width="1560" height="830" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Contratos on-chain: router, router V2, factory, cuenta y vault en EVM; forwarder de Circle, factory, cuenta, verificadores y vault en Soroban. El Relayer es el operador.">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1e1e1e"/></marker></defs>
<text x="40" y="50" font-size="26" font-weight="700" text-anchor="start" fill="#1e1e1e" >Contratos on-chain · qué hace cada uno</text>
<text x="40" y="76" font-size="14" text-anchor="start" fill="#495057" >El Relayer es el operador: envía las transacciones y paga el gas. TilcAI nunca es firmante de una cuenta que emite.</text>
<rect x="620" y="100" width="300" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="770" y="134.875" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">OpenZeppelin Relayer  (operador)</text>
<text x="770" y="157.375" font-size="12.5" text-anchor="middle" fill="#495057">envía las transacciones y paga el gas</text>
<rect x="40" y="250" width="700" height="500" rx="16" fill="#e5dbff" fill-opacity=".35" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="276" font-size="15" font-weight="700" fill="#7048e8">Contratos EVM  ·  Avalanche Fuji / C-Chain  (y Monad Testnet)</text>
<rect x="70" y="300" width="290" height="120" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="215" y="346.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcaiCctpRouter</text>
<text x="215" y="369.25" font-size="12.5" text-anchor="middle" fill="#495057">burn gasless: EIP-3009 del pagador</text>
<text x="215" y="385.5" font-size="12.5" text-anchor="middle" fill="#495057">→ depositForBurnWithHook (CCTP V2)</text>
<rect x="430" y="300" width="280" height="120" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="570" y="346.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcaiCctpRouterV2</text>
<text x="570" y="369.25" font-size="12.5" text-anchor="middle" fill="#495057">igual, pero firma una cuenta</text>
<text x="570" y="385.5" font-size="12.5" text-anchor="middle" fill="#495057">(ERC-1271 / ERC-7739)</text>
<rect x="70" y="470" width="290" height="100" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="215" y="506.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcaiAccountFactory</text>
<text x="215" y="529.25" font-size="12.5" text-anchor="middle" fill="#495057">getAddress · createAccount</text>
<text x="215" y="545.5" font-size="12.5" text-anchor="middle" fill="#495057">(clones con dirección determinista)</text>
<rect x="430" y="470" width="280" height="100" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="570" y="506.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcaiAccount</text>
<text x="570" y="529.25" font-size="12.5" text-anchor="middle" fill="#495057">dueño: passkey P-256 (WebAuthn)</text>
<text x="570" y="545.5" font-size="12.5" text-anchor="middle" fill="#495057">TilcAI no es firmante</text>
<rect x="70" y="620" width="290" height="100" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="215" y="656.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">TilcaiVault</text>
<text x="215" y="679.25" font-size="12.5" text-anchor="middle" fill="#495057">disburse(id, to, monto)</text>
<text x="215" y="695.5" font-size="12.5" text-anchor="middle" fill="#495057">tope por pago y por día · un pago por id</text>
<rect x="430" y="620" width="280" height="100" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="570" y="664.875" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">Circle CCTP V2</text>
<text x="570" y="687.375" font-size="12.5" text-anchor="middle" fill="#495057">TokenMessengerV2 + USDC nativo</text>
<polyline points="360,520 430,520" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="395" y="491.5" font-size="11.5" text-anchor="middle" fill="#495057" >crea</text>
<polyline points="570,420 570,470" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="578" y="448" font-size="12" text-anchor="start" fill="#495057" >valida la firma</text>
<rect x="900" y="250" width="620" height="500" rx="16" fill="#e5dbff" fill-opacity=".35" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="916" y="276" font-size="15" font-weight="700" fill="#7048e8">Contratos Soroban  ·  Stellar Testnet / Public</text>
<rect x="930" y="300" width="270" height="120" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="1065" y="346.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">CctpForwarder  (Circle)</text>
<text x="1065" y="369.25" font-size="12.5" text-anchor="middle" fill="#495057">mint_and_forward</text>
<text x="1065" y="385.5" font-size="12.5" text-anchor="middle" fill="#495057">USDC al G… final (viaja en hookData)</text>
<rect x="1240" y="300" width="250" height="120" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="1365" y="346.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">Verificadores</text>
<text x="1365" y="369.25" font-size="12.5" text-anchor="middle" fill="#495057">Ed25519 · WebAuthn P-256</text>
<text x="1365" y="385.5" font-size="12.5" text-anchor="middle" fill="#495057">(OpenZeppelin stellar-accounts)</text>
<rect x="930" y="470" width="270" height="100" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="1065" y="506.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">tilcai_account_factory</text>
<text x="1065" y="529.25" font-size="12.5" text-anchor="middle" fill="#495057">emite la cuenta del tercero</text>
<text x="1065" y="545.5" font-size="12.5" text-anchor="middle" fill="#495057">(el dueño no necesita XLM)</text>
<rect x="1240" y="470" width="250" height="100" rx="10" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
<text x="1365" y="514.875" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">tilcai_account</text>
<text x="1365" y="537.375" font-size="12.5" text-anchor="middle" fill="#495057">cuenta + política de límite</text>
<rect x="930" y="620" width="270" height="100" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="1065" y="656.75" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">tilcai_vault</text>
<text x="1065" y="679.25" font-size="12.5" text-anchor="middle" fill="#495057">mismo contrato lógico que el vault EVM</text>
<text x="1065" y="695.5" font-size="12.5" text-anchor="middle" fill="#495057">(límites y un pago por id)</text>
<polyline points="1200,520 1240,520" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="1220" y="491.5" font-size="11.5" text-anchor="middle" fill="#495057" >crea</text>
<polyline points="1365,470 1365,420" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="1372" y="448" font-size="12" text-anchor="start" fill="#495057" >verifica</text>
<polyline points="710,670 820,670 820,360 930,360" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="830" y="491.5" font-size="11.5" text-anchor="start" fill="#495057" >CCTP V2:</text>
<text x="830" y="505.875" font-size="11.5" text-anchor="start" fill="#495057" >burn →</text>
<text x="830" y="520.25" font-size="11.5" text-anchor="start" fill="#495057" >atestación</text>
<text x="830" y="534.625" font-size="11.5" text-anchor="start" fill="#495057" >Iris → mint</text>
<polyline points="680,180 480,250" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="460" y="208" font-size="12" text-anchor="end" fill="#495057" >burn · createAccount ·</text>
<text x="460" y="223" font-size="12" text-anchor="end" fill="#495057" >disburse</text>
<polyline points="860,180 1100,250" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)" stroke-linejoin="round"/>
<text x="985" y="188" font-size="12" text-anchor="start" fill="#495057" >mint_and_forward · createAccount ·</text>
<text x="985" y="203" font-size="12" text-anchor="start" fill="#495057" >disburse</text>
<text x="40" y="793" font-size="13" text-anchor="start" fill="#e03131" >Ningún contrato propio tiene auditoría independiente. Direcciones y estado de mainnet: README.md y deploy/MAINNET_DEPLOYMENT.md.</text>
</svg>
