<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Estado de TilcAI en noviembre de 2026: capacidades agrupadas en verificado en testnet, integrado en main, mock o laboratorio, y propuesto o pendiente.">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1e1e1e"/></marker></defs>
<text x="40" y="50" font-size="26" font-weight="700" text-anchor="start" fill="#1e1e1e">Estado del proyecto · noviembre de 2026</text>
<text x="40" y="76" font-size="14" text-anchor="start" fill="#495057">Qué existe, qué está probado y qué falta. El código y sus pruebas mandan; una prueba testnet acredita solo la ruta reproducida.</text>
<rect x="40" y="100" width="340" height="540" rx="16" fill="#d3f9d8" fill-opacity=".35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#2f9e44">Verificado en testnet</text>
<rect x="54" y="140" width="312" height="106" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
<text x="66" y="161" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">CCTP Fuji → Stellar, gasless</text>
<text x="66" y="180.0" font-size="12" text-anchor="start" fill="#495057">USDC nativo; API, worker y tests.</text>
<text x="66" y="195.5" font-size="12" text-anchor="start" fill="#495057">Reportado: otro integrante debe</text>
<text x="66" y="211.0" font-size="12" text-anchor="start" fill="#495057">reproducirlo antes del pitch.</text>
<rect x="54" y="262" width="312" height="106" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
<text x="66" y="283" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Vault de desembolsos (Fuji)</text>
<text x="66" y="302.0" font-size="12" text-anchor="start" fill="#495057">TilcaiVault: seis desembolsos</text>
<text x="66" y="317.5" font-size="12" text-anchor="start" fill="#495057">CONFIRMED en la E2E con Optipagos</text>
<text x="66" y="333.0" font-size="12" text-anchor="start" fill="#495057">(9/oct).</text>
<rect x="54" y="384" width="312" height="106" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
<text x="66" y="405" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Cuentas SCA en Fuji</text>
<text x="66" y="424.0" font-size="12" text-anchor="start" fill="#495057">POST /v1/accounts con passkey;</text>
<text x="66" y="439.5" font-size="12" text-anchor="start" fill="#495057">factory y router v2 desplegados.</text>
<text x="66" y="455.0" font-size="12" text-anchor="start" fill="#495057">Falta delegación, recuperación, Stellar.</text>
<rect x="54" y="506" width="312" height="106" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
<text x="66" y="527" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Canal de eventos al monitor</text>
<text x="66" y="546.0" font-size="12" text-anchor="start" fill="#495057">Eventos firmados a tilcai-web;</text>
<text x="66" y="561.5" font-size="12" text-anchor="start" fill="#495057">vista base en /[lang]/monitor.</text>
<text x="66" y="577.0" font-size="12" text-anchor="start" fill="#495057">Verificado en local; falta tablero.</text>
<rect x="400" y="100" width="340" height="540" rx="16" fill="#dbe4ff" fill-opacity=".35" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="416" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#3b5bdb">Integrado en main (sin desplegar)</text>
<rect x="414" y="140" width="312" height="106" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="426" y="161" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">@tilcai/core 0.1.0</text>
<text x="426" y="180.0" font-size="12" text-anchor="start" fill="#495057">Contratos compartidos, privado en</text>
<text x="426" y="195.5" font-size="12" text-anchor="start" fill="#495057">GitHub Packages (PR8).</text>
<text x="426" y="211.0" font-size="12" text-anchor="start" fill="#495057">Web aún no lo consume.</text>
<rect x="414" y="262" width="312" height="106" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="426" y="283" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Credenciales de terceros</text>
<text x="426" y="302.0" font-size="12" text-anchor="start" fill="#495057">API keys con caducidad, rotación</text>
<text x="426" y="317.5" font-size="12" text-anchor="start" fill="#495057">y contexto; migración 8 (PR53).</text>
<text x="426" y="333.0" font-size="12" text-anchor="start" fill="#495057">253 tests TypeScript en verde.</text>
<rect x="414" y="384" width="312" height="106" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="426" y="405" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">SDK y MCP</text>
<text x="426" y="424.0" font-size="12" text-anchor="start" fill="#495057">Introspección, QR y recarga de</text>
<text x="426" y="439.5" font-size="12" text-anchor="start" fill="#495057">secretos; consumen Core (PR1 c/u).</text>
<text x="426" y="455.0" font-size="12" text-anchor="start" fill="#495057">No republicados en npm.</text>
<rect x="414" y="506" width="312" height="106" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="426" y="527" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Vault: evidencia y reservas</text>
<text x="426" y="546.0" font-size="12" text-anchor="start" fill="#495057">PR48: reserva atómica y preflight</text>
<text x="426" y="561.5" font-size="12" text-anchor="start" fill="#495057">Soroban. Issues #28/#35/#42 aún</text>
<text x="426" y="577.0" font-size="12" text-anchor="start" fill="#495057">esperan revisión independiente.</text>
<rect x="760" y="100" width="340" height="540" rx="16" fill="#fff3bf" fill-opacity=".35" stroke="#f08c00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="776" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#f08c00">Mock, prototipo o laboratorio</text>
<rect x="774" y="140" width="312" height="106" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
<text x="786" y="161" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">QR Simple</text>
<text x="786" y="180.0" font-size="12" text-anchor="start" fill="#495057">Genera desde payload; el banco es</text>
<text x="786" y="195.5" font-size="12" text-anchor="start" fill="#495057">un mock (/mock/vendis).</text>
<text x="786" y="211.0" font-size="12" text-anchor="start" fill="#495057">No mueve dinero real.</text>
<rect x="774" y="262" width="312" height="106" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
<text x="786" y="283" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">x402 + OpenZeppelin Relayer</text>
<text x="786" y="302.0" font-size="12" text-anchor="start" fill="#495057">Prueba aislada con XLM. Falta</text>
<text x="786" y="317.5" font-size="12" text-anchor="start" fill="#495057">repetir /verify y /settle con USDC</text>
<text x="786" y="333.0" font-size="12" text-anchor="start" fill="#495057">y cuenta prevista.</text>
<rect x="774" y="384" width="312" height="106" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
<text x="786" y="405" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Ocho redes CCTP</text>
<text x="786" y="424.0" font-size="12" text-anchor="start" fill="#495057">Eth Sepolia, Fuji, Arbitrum, Base,</text>
<text x="786" y="439.5" font-size="12" text-anchor="start" fill="#495057">Arc, Solana, Sui, Stellar: código y</text>
<text x="786" y="455.0" font-size="12" text-anchor="start" fill="#495057">matriz; solo Fuji verificado.</text>
<rect x="774" y="506" width="312" height="106" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
<text x="786" y="527" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Política, aprobación y WhatsApp</text>
<text x="786" y="546.0" font-size="12" text-anchor="start" fill="#495057">Puertos y prototipo; WhatsApp sale</text>
<text x="786" y="561.5" font-size="12" text-anchor="start" fill="#495057">del relato del 2/oct, sin adaptador</text>
<text x="786" y="577.0" font-size="12" text-anchor="start" fill="#495057">integrado. Web: escenas simuladas.</text>
<rect x="1120" y="100" width="340" height="540" rx="16" fill="#ffe3e3" fill-opacity=".35" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1136" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#e03131">Propuesto o pendiente</text>
<rect x="1134" y="140" width="312" height="106" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="1146" y="161" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Checkout comercial integrado</text>
<text x="1146" y="180.0" font-size="12" text-anchor="start" fill="#495057">Unir cotización → orden → pago →</text>
<text x="1146" y="195.5" font-size="12" text-anchor="start" fill="#495057">cumplimiento con un negocio piloto</text>
<text x="1146" y="211.0" font-size="12" text-anchor="start" fill="#495057">y su agente vendedor.</text>
<rect x="1134" y="262" width="312" height="106" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="1146" y="283" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Facturación SIN</text>
<text x="1146" y="302.0" font-size="12" text-anchor="start" fill="#495057">Diseño (empresa única y terceros).</text>
<text x="1146" y="317.5" font-size="12" text-anchor="start" fill="#495057">Sin módulo fiscal desplegado;</text>
<text x="1146" y="333.0" font-size="12" text-anchor="start" fill="#495057">normativa 2026 por validar.</text>
<rect x="1134" y="384" width="312" height="106" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="1146" y="405" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">TTL Soroban (#32)</text>
<text x="1146" y="424.0" font-size="12" text-anchor="start" fill="#495057">Matriz local con ledger sintético.</text>
<text x="1146" y="439.5" font-size="12" text-anchor="start" fill="#495057">Falta aceptación D-05 del</text>
<text x="1146" y="455.0" font-size="12" text-anchor="start" fill="#495057">horizonte operativo.</text>
<rect x="1134" y="506" width="312" height="106" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="1146" y="527" font-size="13.5" font-weight="700" text-anchor="start" fill="#1e1e1e">Rampa BOB ↔ USDC y mainnet</text>
<text x="1146" y="546.0" font-size="12" text-anchor="start" fill="#495057">Sin proveedor ni corredor verificado.</text>
<text x="1146" y="561.5" font-size="12" text-anchor="start" fill="#495057">Ningún contrato propio tiene</text>
<text x="1146" y="577.0" font-size="12" text-anchor="start" fill="#495057">auditoría independiente.</text>
<rect x="40" y="670" width="1420" height="150" rx="16" fill="#f1f3f5" fill-opacity=".35" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="696" font-size="15" font-weight="700" text-anchor="start" fill="#495057">Lo que NO se puede afirmar todavía</text>
<text x="60" y="734" font-size="12.5" text-anchor="start" fill="#1e1e1e">•  «Compra comercial de punta a punta»: el riel técnico existe; la unión con catálogo, orden y cumplimiento está pendiente.</text>
<text x="60" y="755" font-size="12.5" text-anchor="start" fill="#1e1e1e">•  «Cualquier dinero en cualquier red»: CCTP mueve USDC nativo solo entre redes habilitadas; Fuji → Stellar es el único corredor verificado.</text>
<text x="60" y="776" font-size="12.5" text-anchor="start" fill="#1e1e1e">•  «Producción / mainnet / cobros reales con QR»: no hay rampa fiat ni auditoría; el QR es un mock y los contratos no están auditados.</text>
<text x="60" y="797" font-size="12.5" text-anchor="start" fill="#1e1e1e">•  «Adopción»: no hay métricas reales de uso del piloto que citar.</text>
<text x="40" y="850" font-size="11.5" text-anchor="start" fill="#495057">Fuentes: 0-OFICIAL/CONTEXTO_OFICIAL_TILCAI.md, 3-CONSTRUCCION/INTEGRACION_Y_RAMA_AUDITORIA_2026-11-04.md y ESTADO_REPOSITORIOS_2026-11-01.md. Cortes: oct. y 4-nov-2026.</text>
</svg>
